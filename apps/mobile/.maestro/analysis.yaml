# S19. 분석 요청·상태 폴링 — 업로드 완료 → 분석 자동 시작 → 분석 완료 (반자동, #63)
# 사전조건: 로그인 · 무료 분석 1회 이상 · 로컬 API+worker(stub)+Redis+Postgres 기동 · Draft에 이미지(피커 수동)
appId: com.chan.clauselens
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "계약서, 찍기만 하세요"
    timeout: 15000
# 사진 추가(수동: 갤러리에서 선택 → 사진 고르기)
- tapOn: "갤러리에서 선택"
- extendedWaitUntil:
    visible: "분석하기"
    timeout: 30000
# 분석하기 → 업로드 → 업로드 확정 후 분석 자동 시작("계약서를 분석하고 있어요") → 완료 대기
- tapOn: "분석하기"
- extendedWaitUntil:
    visible: "계약서를 분석하고 있어요"
    timeout: 60000
# 완료(done) 또는 일부 완료(partial)
- extendedWaitUntil:
    visible: "(분석이 끝났어요|일부만 분석됐어요)"
    timeout: 90000
