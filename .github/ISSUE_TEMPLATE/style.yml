name: Style
description: UI, 카피, 레이아웃, 디자인 일관성 개선을 기록합니다.
title: "[Style] "
labels:
  - style
body:
  - type: textarea
    id: current
    attributes:
      label: 현재 상태
      description: 어떤 시각적 문제나 일관성 문제가 있는지 적어주세요.
      placeholder: 결과 카드의 여백과 타이포그래피가 화면마다 다릅니다.
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 원하는 방향
      description: 어떻게 보이길 원하는지 적어주세요.
      placeholder: 주요 CTA는 같은 크기와 간격을 유지하고, 결과 카드는 더 읽기 쉬워야 합니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 스크린샷, 피그마, 참고 링크가 있으면 적어주세요.
      placeholder: iOS 설정 앱 리스트 간격 느낌 참고
  - type: dropdown
    id: surface
    attributes:
      label: 대상 영역
      options:
        - App UI
        - Copy / Text
        - Design system
        - Other
    validations:
      required: true
