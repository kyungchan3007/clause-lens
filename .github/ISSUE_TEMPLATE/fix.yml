name: Fix
description: 버그, 회귀, 예외 상황 수정 이슈를 작성합니다.
title: "[Fix] "
labels:
  - fix
body:
  - type: textarea
    id: bug
    attributes:
      label: 문제 현상
      description: 실제로 어떤 문제가 발생하는지 적어주세요.
      placeholder: 특정 문서에서 하이라이트가 원본 이미지와 어긋나게 표시됩니다.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 재현 순서를 적어주세요.
      placeholder: |
        1. 문서를 업로드한다
        2. 분석 완료 후 결과 화면으로 이동한다
        3. 확대 배율을 바꾸면 위치가 어긋난다
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 원래 어떻게 동작해야 하는지 적어주세요.
      placeholder: 모든 배율에서 박스 좌표가 이미지와 정확히 맞아야 합니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 사용자 영향도나 우선순위를 판단할 정보를 적어주세요.
      placeholder: 결과 화면 핵심 기능이라 사용자 신뢰에 직접 영향이 있습니다.
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
