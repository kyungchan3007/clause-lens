name: Refactor
description: 동작은 유지하면서 구조를 개선하는 작업을 기록합니다.
title: "[Refactor] "
labels:
  - refactor
body:
  - type: textarea
    id: target
    attributes:
      label: 대상
      description: 어떤 코드나 구조를 정리하려는지 적어주세요.
      placeholder: 분석 상태 폴링 로직이 여러 화면에 분산되어 있습니다.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 이유
      description: 왜 지금 리팩터링이 필요한지 적어주세요.
      placeholder: 중복 로직 때문에 상태 불일치와 수정 비용이 커졌습니다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위
      description: 어디까지 바꿀지와 무엇은 안 바꿀지 적어주세요.
      placeholder: 훅과 API 호출 계층만 정리하고 UI 동작은 유지합니다.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 리스크 / 확인 포인트
      description: 회귀 위험이나 꼭 확인할 부분을 적어주세요.
      placeholder: 폴링 중 앱 백그라운드 전환 시 상태 누수가 없는지 확인 필요
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - Medium
        - High
        - Low
    validations:
      required: true
