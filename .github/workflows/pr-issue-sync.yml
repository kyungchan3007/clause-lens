name: PR Issue Sync (merge)

# A(#183): PR 머지 시 이슈 완료 조건을 합쳐진 spec의 Acceptance 상태로 자동 미러.
# 보안: pull_request_target로 fork PR에도 쓰기 토큰을 받되, base/merge_commit_sha만 체크아웃하고
#       base 저장소의 node 스크립트(의존성 설치·빌드 없음)만 실행한다 — fork head 코드는 절대 실행 안 함.

on:
  pull_request_target:
    types:
      - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request number to sync manually
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: pr-issue-sync-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out merged result (base repo — never fork head)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mirror issue checkboxes from merged spec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node .github/scripts/issue-sync-merged.mjs
